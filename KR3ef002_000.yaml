body:
  text: 傷寒傳經在太陽脈浮而急數發熱無汗煩躁宜麻黃湯麻黃湯方麻黃三兩去節桂枝三兩去皮甘草一兩炙杏仁七十枚去皮尖右四味以水九升先煮麻黃減二升去上沫納諸藥煮取二升半去滓溫服八合覆取微似汗不須粥飲餘如桂枝法將息桂枝湯見後卷傳陽明脈大而數發熱汗出口渴舌燥宜白虎湯不差與承氣湯白虎湯方知母六兩石膏一斤碎甘草二兩炙粳米六合右四味以水一斗煮米熟湯成去滓溫服一升日三服大承氣湯方大黃四兩酒洗厚朴半斤炙去皮枳實五枚芒硝三合右四味以水一斗先煮二物取五升去滓納大黃更煮取二升去滓納芒硝更上微火一兩沸分溫再服得下餘勿服小承氣湯方大黃四兩酒洗厚朴二兩炙去皮枳實三枚大者炙右三味以水四升煮取一升二合去滓分溫二服初服當更衣不爾者盡飲之若更衣者勿服之調胃承氣湯方甘草二兩炙芒硝半斤大黃四兩酒洗右三味以水三升煮二物至一升取去滓納芒硝更上微火一兩沸溫頓服之以調胃氣傳少陽脈弦而急口苦咽乾頭暈目眩往來寒熱熱多寒少宜小柴胡湯不差與大柴胡湯小柴胡湯方柴胡半斤黃芩三兩人參三兩甘草三兩炙生薑三兩大棗十二枚半夏半升右七味以水一斗二升煮取六升去滓再煎取三升溫服一升日三服大柴胡湯方柴胡半斤黃芩三兩芍藥三兩半夏半升洗枳實四枚炙大黃二兩生薑五兩切大棗十二枚劈右八味以水一斗二升煮取六升去滓再煎溫服二升日三服傳太陰脈濡而大發熱下利口渴腹中急痛宜茯苓白朮厚朴石膏黃芩甘草湯茯苓白朮厚朴石膏黃芩甘草湯方茯苓四兩白朮三兩厚朴四兩石膏半斤黃芩三兩甘草二兩炙右六味以水一斗煮取五升每服一升五合餘日三服傳少陰脈沉細而數手足時厥時熱咽中痛小便難宜附子細辛黃連黃芩湯附子細辛黃連黃芩湯方附子大者一枚炮去皮破八片細辛二兩黃連四兩黃芩二兩右四味以水六升煮取三升溫服一升日三服傳厥陰脈沉弦而急發熱時悚心煩嘔逆宜桂枝當歸湯吐蛔者宜烏梅丸桂枝當歸湯方桂枝二兩當歸三兩半夏一升芍藥三兩黃柏二兩甘草二兩炙右六味以水七升煮取四升去滓分溫三服烏梅丸方烏梅三百枚細辛六兩乾薑十兩黃連十六兩當歸四兩附子六兩炮去皮蜀椒四兩出汗桂枝六兩去皮人參六兩黃柏六兩右十味異搗篩合治之以苦酒漬烏梅一宿去核蒸之五斗米下飯熟搗成泥和藥令相得納臼中與蜜杵二千下丸如梧桐子大先食飲服十丸日三服稍加至二十丸禁生冷滑物臭食等若兩感於寒者一日太陽受之即與少陰俱病則頭痛口乾煩滿而渴脈時浮時沉時數時細大青龍湯加附子湯主之大青龍加附子湯方麻黃六兩去節桂枝二兩去皮甘草二兩炙杏仁四十枚去皮尖生薑三兩切大棗十枚劈石膏如雞子大附子一枚炮去皮破八片右八味以水九升先煮麻黃減二升去上沫納諸藥煮取三升去滓溫服一升取微似汗汗出多者溫粉粉之一服汗者停後服若復服汗多亡陽遂虛惡風煩躁不得眠也二日陽明受之即與太陰俱病則腹滿身熱不欲食讝語脈時高時卑時強時弱宜大黃石膏茯苓白朮枳實甘草湯大黃石膏茯苓白朮枳實甘草湯方大黃四兩石膏一斤茯苓三兩白朮四兩枳實三兩甘草三兩炙右六味以水八升煮取五升溫分三服三日少陽受之即與厥陰俱病則耳聾囊縮而厥水漿不入脈乍弦乍急乍細乍散宜當歸附子湯主之當歸附子湯方當歸四兩附子大者一枚炮去皮破八片人參三兩黃連三兩黃柏三兩右五味以水六升煮取三升溫服一升日三服病春溫其氣在上頭痛咽乾發熱目眩甚則讝語脈弦而急小柴胡加黃連牡丹湯主之小柴胡加黃連牡丹湯方柴胡半斤黃芩三兩人參三兩栝蔞根四兩黃連三兩牡丹皮四兩甘草三兩炙生薑三兩大棗十二枚劈右九味以水一斗二升煮取三升去滓溫服一升日三服病秋溫其氣在中發熱口渴腹中熱痛下利便膿血脈大而短澀地黃知母黃連阿膠湯主之不便膿血者白虎湯主之地黃知母黃連阿膠湯方地黃八兩知母四兩黃連三兩阿膠一兩右四味以水一斗先煮三味取三升去滓納膠煬消溫服一升日三服白虎湯方知母六兩石膏一斤碎棉裹甘草二兩炙粳米六合右四味以水一斗煮米熟湯成去滓溫服一升日三服病冬溫其氣在下發熱腹痛引少腹夜半咽中乾痛脈沉實時而大數石膏黃連黃芩甘草湯主之不大便六七日者大黃黃芩地黃牡丹湯主之石膏黃連黃芩甘草湯方石膏半斤碎棉裹黃連三兩黃芩四兩甘草二兩右四味以水一斗煮取三升溫服一升日三服大黃黃芩地黃牡丹湯方大黃四兩黃芩三兩地黃四兩牡丹皮三兩右四味以水一斗二升煮取二升去滓分溫二服大便利止後服病溫頭痛面赤發熱手足拘急脈浮弦而數名曰風溫黃連黃芩梔子牡丹芍藥湯主之黃連黃芩梔子牡丹芍藥湯方黃連三兩黃芩三兩梔子十四枚劈牡丹三兩芍藥三兩右五味以水六升煮取三升去滓溫服一升日三服病溫其人素有濕發熱唇焦下利腹中熱痛脈大而數名曰濕溫豬苓加黃連牡丹湯主之豬苓加黃連牡丹湯方豬苓一兩茯苓一兩阿膠一兩澤瀉一兩滑石一兩黃連一兩牡丹一兩右七味以水四升先煮六味取二升去滓納膠煬消分溫再服病溫舌赤咽乾心中煩熱脈急數上寸口者溫邪干心也黃連黃芩阿膠甘草湯主之黃連黃芩阿膠甘草湯方黃連一兩黃芩一兩阿膠一兩甘草一兩右四味以水一斗先煮三味取四升去滓納膠煬消分溫三服病溫口渴咳嗽衄不止脈浮而數大此溫邪乘肺也黃芩石膏杏子甘草湯主之黃芩石膏杏子甘草湯方黃芩三兩石膏半斤碎杏仁十四枚去皮尖甘草一兩炙右四味以水五升煮取三升去滓溫服一升日三服病溫發熱腰以下有水氣甚則少腹熱痛小便赤數脈急而數下尺中者此溫邪移腎也地黃黃柏秦皮茯苓澤瀉湯主之地黃黃柏秦皮茯苓澤瀉湯方地黃六兩黃柏三兩秦皮二兩茯苓三兩澤瀉一兩右五味以水八升煮取三升去滓溫服一升日三服病大溫發熱頭暈目眩齒枯唇焦讝語不省人事面色乍青乍赤脈急大而數者大黃香蒲湯主之若喉閉難下咽者針少商令出血若脈乍疏乍數目內陷者死大黃香蒲湯方大黃四兩香蒲一兩黃連三兩地黃半斤牡丹皮六兩右五味以水一斗煮取六升去滓溫服二升日三服溫病下之大便溏當自愈若下之利不止者必腹滿宜茯苓白朮甘草湯主之茯苓白朮甘草湯方茯苓四兩白朮三兩甘草一兩炙右三味以水八升煮取三升去滓溫服一升日三服風溫者因其人素有熱更傷於風而為病也脈浮弦而數若頭不痛者桂枝去桂加黃芩牡丹湯主之若伏氣病溫誤發其汗則大熱煩冤唇焦目赤或衄或吐耳聾脈大而數者宜白虎湯大實者宜承氣輩若至十餘日則入於裏宜黃連阿膠湯何以知其入裏以脈沉而數心煩不臥故知之也白虎湯方見前桂枝去桂加黃芩牡丹湯方芍藥三兩甘草二兩炙生薑三兩切大棗十二枚劈黃芩三兩牡丹皮三兩右六味以水八升煮取三升去滓溫服一升日三服大承氣湯方大黃四兩酒洗厚朴半斤製枳實五枚炙芒硝三合右四味以水一斗先煮二物取五升去滓納大黃更煮取二升去滓納芒硝更上微火一兩沸分溫再服得下餘勿服小承氣湯方大黃四兩酒洗厚朴二兩製枳實三枚大者炙右三味以水四升煮取一升二合去滓分溫二服初服當更衣不爾盡飲之若更衣者勿服之調胃承氣湯方大黃四兩酒洗甘草二兩炙芒硝半斤右三味以水三升煮二物至一升去滓納芒硝更上微火煮令沸少少溫服之黃連阿膠湯方黃連四兩芍藥二兩黃芩二兩阿膠三兩雞子黃三枚右五味以水六升先煮三物取二升去滓納阿膠煬消小冷納雞子黃攪令相得溫服七合日三服病溫治不得法留久移於三焦其在上焦則舌蹇神昏宜梔子湯其在中焦則腹痛而利利後腹痛唇口乾燥宜白虎加地黃湯其在下焦從腰以下熱齒黑咽乾宜百合地黃牡丹皮半夏茯苓湯梔子湯方梔子十六枚劈黃芩三兩半夏半斤甘草二兩右四味以水四升先煮梔子取二升半去滓納三味煮取一升去滓分溫再服白虎加地黃湯方知母六兩石膏一斤碎甘草二兩炙粳米六合地黃六兩右五味以水一斗煮米熟湯成去滓溫服一升日三服百合地黃牡丹皮半夏茯苓湯方百合七枚劈地黃汁一升牡丹皮六兩半夏一升茯苓四兩右五味先以水洗百合漬一宿當白沫出去其水別以水二升煮取一升去滓別以泉水四升煮三味取二升去滓納地黃汁與百合汁更上火令沸溫服一升日三服傷暑肺先受之肺為氣府暑傷元氣寸口脈弱口渴汗出神昏氣短竹葉石膏湯主之竹葉石膏湯方竹葉兩把粳米半升半夏半升洗石膏一斤人參三兩麥門冬一升甘草二兩炙右七味以水一斗先煮六味取六升去滓納粳米煮取米熟湯成溫服一升日三服傷暑發熱汗出口渴脈浮而大名曰中暍白虎加人參黃連阿膠湯主之白虎加人參黃連阿膠湯方知母六兩石膏一斤碎棉裹甘草二兩炙粳米六合人參三兩黃連三兩阿膠二兩右七味以水一斗先煮六味米熟湯成去滓納膠煬消溫服一升日三服傷暑汗出已發熱煩躁聲嘶脈反浮數者此為肺液傷百合地黃加牡蠣湯主之百合地黃加牡蠣湯方百合七枚地黃汁一升牡蠣二兩右三味先以水洗百合漬一宿當白沫出去其水另以泉水二升煮二味取一升去滓納地黃汁煮取一升五合分溫再服傷暑心下有水氣汗出咳嗽渴欲飲水水入則吐脈弱而滑栝蔞茯苓湯主之栝蔞茯苓湯方栝蔞大者一枚共皮子搗茯苓三兩半夏三兩洗黃連二兩甘草一兩炙右五味以水五升煮取二升溫服一升日再服傷暑發熱無汗水行皮中故也脈必浮而滑先以熱水灌之令汗出後以竹茹半夏湯與之竹茹半夏湯方竹茹二兩栝蔞根二兩茯苓三兩半夏半升右四味以水五升煮取三升分溫三服太陽中熱者暍是也其人汗出惡寒身熱而渴白虎加人參湯主之白虎加人參湯方知母六兩石膏一斤碎棉裹甘草二兩炙粳米六合人參三兩右五味以水一斗煮米熟湯成去滓溫服一升日三服太陽中暍身熱疼重而脈微弱者以夏月傷冷水水行皮中所致也豬苓加人參湯主之一物瓜蒂湯亦主之豬苓加人參湯方豬苓一兩茯苓一兩滑石一兩澤瀉一兩阿膠一兩人參三兩右六味以水四升先煮五味取二升納阿膠煬消溫服七合日三服一物瓜蒂湯方瓜蒂二十個右銼以水一升煮取五合去滓頓服傷暑夜臥不安煩躁讝語舌赤脈數此為暑邪干心也黃連半夏石膏甘草湯主之黃連半夏石膏甘草湯方黃連三兩半夏半升石膏一斤碎棉裹甘草二兩炙右四味以水五升煮取三升去滓溫服一升日三服太陽中暍發熱惡寒身重疼痛其脈弦細芤遲小便已灑灑然毛聳手足逆冷小有勞身即熱口開前板齒燥若發汗則惡寒甚加溫針則發熱甚數下之則淋甚白虎加桂枝人參芍藥湯主之白虎加桂枝人參芍藥湯方知母六兩石膏一斤碎棉裹甘草二兩炙粳米六合桂枝一兩人參三兩芍藥二兩右七味以水八升煮米熟湯成溫服一升日三服傷暑脈弱口渴大汗出頭暈者人參石膏湯主之人參石膏湯方人參三兩石膏一斤碎棉裹竹葉一把黃連一兩半夏半升洗右五味以水六升煮取三升去滓溫服一升日三服熱病面赤口爛心中痛欲嘔脈洪而數此熱邪干心也黃連黃芩瀉心湯主之黃連黃芩瀉心湯方黃連三兩黃芩二兩右二味以