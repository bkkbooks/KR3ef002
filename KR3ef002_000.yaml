食七八日更發熱者此為胃實大承氣湯主之大承氣湯方大黃四兩酒洗厚朴半斤炙去皮枳實五枚炙芒硝三合右四味以水一斗先煮二物取五升去滓納大黃更煮取二升去滓納芒硝更上微火一兩沸分溫再服得下停後服産後腹中癘痛若虛寒不足者當歸生薑羊肉湯主之當歸生薑羊肉湯方當歸三兩生薑五兩羊肉一斤右三味以水八升煮取三升去滓溫服一升日三服産後腹痛煩滿不得臥不可下也宜枳實芍藥散和之枳實芍藥散方枳實芍藥等分右二味杵為散服方寸匙日三服麥粥和下之師曰産後腹痛法當以枳實芍藥散假令不愈必腹中有瘀血著臍下也下瘀血湯主之下瘀血湯方大黃三兩桃仁二十枚去皮尖庶蟲二十枚去足右三味末之煉蜜和丸以酒一升煮取八合頓服之當下血如豚肝産後中風發熱面赤頭痛汗出而喘脈弦數者竹葉湯主之竹葉湯方竹葉一把葛根三兩桔梗一兩人參一兩甘草一兩生薑五兩大棗十五枚劈右七味以水八升煮取三升去滓溫服一升日三服産後煩亂嘔逆無外證者此乳中虛也竹皮大丸主之竹皮大丸方竹茹二分石膏二分桂枝一分甘草七分白薇一分右五味末之棗肉和丸如彈子大飲服一丸日三服夜二服有熱者倍白薇産後下利脈虛極者白頭翁加甘草阿膠湯主之白頭翁加甘草阿膠湯方白頭翁二兩黃連三兩柏皮三兩秦皮三兩甘草二兩阿膠二兩右六味以水五升先煮五味取三升去滓納膠煬消分溫三服婦人咽中如有炙臠者半夏厚朴茯苓生薑湯主之半夏厚朴茯苓生薑湯方半夏一升厚朴三兩茯苓四兩生薑五兩蘇葉二兩右五味以水一斗煮取四升去滓分溫四服日三服夜一服苦痛者去蘇葉加桔梗二兩婦人臟燥悲傷欲哭數缺伸象如神靈所作者甘草小麥大棗湯主之甘草小麥大棗湯方甘草三兩小麥一升大棗十枚劈右三味以水六升煮取三升去滓分溫三服婦人吐涎沫醫反下之心下即痞當先治其吐涎沫後治其痞治吐宜桔梗甘草茯苓澤瀉湯治痞宜瀉心湯桔梗甘草茯苓澤瀉湯方桔梗三兩甘草二兩茯苓三兩澤瀉二兩右四味以水五升煮取三升去滓溫服一升日三服瀉心湯方大黃二兩黃連一兩右二味以麻沸湯二升漬之須臾絞去滓分溫再服問曰婦人年五十所病下血數十日不止暮即發熱少腹裏急腹滿手掌煩熱唇口乾燥何也師曰此病屬帶下何以知之曾經半産瘀血在少腹不去故唇口乾燥也溫經湯主之溫經湯方吳茱萸三兩當歸二兩芎藭二兩芍藥二兩人參二兩桂枝二兩阿膠二兩牡丹皮二兩甘草二兩生薑二兩右十味以水一斗煮取三升去滓日三服每服一升溫飲之經水不利少腹滿痛或一月再經者王瓜根散主之陰腫者亦主之王瓜根散方王瓜根三分芍藥三分桂枝三分庶蟲三枚右四味杵為散酒服方寸匙日三服婦人半産若漏下者旋覆花湯主之脈虛弱者黃耆當歸湯主之旋覆花湯方旋覆花三兩蔥十四莖新絳少許右三味以水三升煮取一升去滓頓服之黃耆當歸湯方黃耆三兩當歸半兩右二味以水五升煮取三升去滓溫服一升日三服婦人陷經漏下色黑如塊者膠薑湯主之膠薑湯方阿膠三兩地黃六兩芎藭二兩生薑三兩切當歸三兩芍藥三兩甘草二兩炙右七味以水五升清酒三升先煮六味取三升去滓納膠煬消溫服一升日三服婦人少腹滿如敦狀小便微難而不渴或經後産後者此為水與血俱結在血室也大黃甘遂阿膠湯主之大黃甘遂阿膠湯方大黃四兩甘遂二兩阿膠二兩右三味以水三升煮二味取一升去滓納膠煬消溫頓服之婦人時腹痛經水時行時止止而復行者抵當湯主之抵當湯方水蛭三十個熬虻蟲三十個去翅足桃仁三十個大黃三兩右四味以水五升煮取三升去滓溫服一升不下更服婦人經水閉臟堅癖下白物不止此中有乾血也礬石丸主之礬石丸方礬石三分燒杏仁一分右二味末之煉蜜為丸棗核大納臟中劇者再納之婦人六十二種風證腹中氣血如刺痛者紅藍花酒主之紅藍花酒方紅藍花一兩右一味以酒一斗煎減半去滓分溫再服婦人腹中諸病痛者當歸芍藥散主之小建中湯亦主之當歸芍藥散見前小建中湯方桂枝三兩芍藥六兩甘草三兩炙生薑三兩切大棗十二枚劈飴糖一升右六味以水七升煮取三升去滓納膠飴更上微火消解溫服一升日三服問曰婦人病飲食如故煩熱不得臥而反倚息者何也師曰此名轉胞不得溺也以胞系了戾故致此病但利小便則愈腎氣丸主之腎氣丸方地黃八兩薯蕷四兩山茱萸四兩澤瀉三兩牡丹皮三兩茯苓三兩桂枝一兩附子一枚炮右八味末之煉蜜和丸梧桐子大溫酒下十五丸日再服不知漸增至二十五丸婦人陰寒蛇床子散主之蛇床子散方蛇床子一兩右一味末之以白粉少許和合相得如棗大棉裹納陰中自溫少陰脈滑而數者陰中瘡也蝕爛者狼牙湯主之狼牙湯方狼牙三兩右一味以水四升煮取半升去滓以綿纏箸如繭大浸湯瀝陰中洗之日四遍胃氣下泄陰吹而喧如失氣者此穀道實也豬膏髮煎主之豬膏髮煎方豬膏半斤亂髮三枚如雞子大右二味和膏煎之髮消藥成分再服
